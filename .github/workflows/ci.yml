name: Ci Build & Test

on:
  push:
    branches: [master,main]
  pull_request:
    branches: [master,main]

jobs:
    build-and-test:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name : Setup JDK 25
          uses : actions/setup-java@v4
          with:
            java-version: '25'
            distribution: 'temurin'
            cache: 'gradle'

        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v4

        - name: Build and Test
          run: ./gradlew build --no-daemon

